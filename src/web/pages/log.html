<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gitpilot · graphe</title>
<style>
:root { color-scheme:light; --bg:#f3f4f6; --panel:#fff; --raised:#e9ebef; --text:#1d2129; --muted:#667085; --line:#dfe2e8; --accent:#1570ef; --hover:#eceef2; --selected:#d9e7fd; --head:#fff4d6; --add:#12845a; --del:#d0342c; --on-avatar:#fff; }
:root[data-theme="dark"] { color-scheme:dark; --bg:#16181d; --panel:#1e2128; --raised:#2a2e37; --text:#e6e8ec; --muted:#8f97a6; --line:#2e323c; --accent:#5ba4f7; --hover:#262a33; --selected:#23364f; --head:#332c17; --add:#45c98f; --del:#f2726a; --on-avatar:#fff; }
* { box-sizing:border-box; }
[hidden] { display:none !important; }
html, body { height:100%; }
body { margin:0; background:var(--bg); color:var(--text); font:13px/1.4 system-ui, sans-serif; display:flex; flex-direction:column; overflow:hidden; }
button, input, select { font:inherit; color:inherit; }
button { cursor:pointer; background:none; border:0; padding:0; }
:focus-visible { outline:2px solid var(--accent); outline-offset:-2px; }
.mono { font-family:ui-monospace, Menlo, Consolas, monospace; }

.topbar { flex:none; display:flex; align-items:center; gap:10px; min-height:48px; padding:7px 12px; background:var(--panel); border-bottom:1px solid var(--line); flex-wrap:wrap; }
.repo { font-size:15px; font-weight:650; white-space:nowrap; }
.current { display:flex; align-items:center; gap:6px; padding:4px 10px; border-radius:6px; background:var(--head); font-weight:600; white-space:nowrap; max-width:280px; }
.current small { color:var(--muted); font-weight:500; }
.current .name { overflow:hidden; text-overflow:ellipsis; }
.chip { display:flex; align-items:center; gap:6px; padding:3px 8px; border-radius:6px; background:var(--selected); white-space:nowrap; max-width:240px; }
.chip span { overflow:hidden; text-overflow:ellipsis; }
#filters { display:flex; gap:6px; flex:1 1 280px; min-width:0; }
#filters input, #filters select { background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:4px 8px; }
#filters input { flex:1; min-width:60px; }
.toolbar-button { padding:4px 9px; border:1px solid var(--line); border-radius:6px; white-space:nowrap; color:inherit; text-decoration:none; }
.toolbar-button:hover { background:var(--hover); }
#menu { display:none; }

.layout { flex:1; min-height:0; display:flex; position:relative; }
#sidebar { flex:none; width:244px; overflow-y:auto; background:var(--panel); border-right:1px solid var(--line); padding:6px 0 20px; }
details > summary { display:flex; justify-content:space-between; cursor:pointer; padding:6px 12px; font-size:11px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--muted); list-style:none; user-select:none; }
details > summary::-webkit-details-marker { display:none; }
details > summary::before { content:"▸"; margin-right:6px; }
details[open] > summary::before { content:"▾"; }
details > summary span:first-of-type { flex:1; }
.group-label { padding:4px 12px 2px 22px; font-size:11px; color:var(--muted); }
.item { display:flex; align-items:center; gap:7px; width:100%; min-height:26px; padding:2px 12px 2px 22px; text-align:left; }
.item:hover { background:var(--hover); }
.item.active { background:var(--selected); }
.item.current-branch { background:var(--head); font-weight:650; }
.item .label { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.item .count { color:var(--muted); font-size:11px; font-variant-numeric:tabular-nums; white-space:nowrap; }
.item.static { cursor:default; } .item.static:hover { background:none; }
.tick { flex:none; width:12px; color:var(--add); font-weight:700; }

.center { flex:1; min-width:0; overflow:auto; background:var(--panel); }
.columns, .row { display:grid; grid-template-columns:190px var(--graph-width, 60px) minmax(240px, 1fr) 160px 132px 84px; align-items:center; min-width:calc(806px + var(--graph-width, 60px)); }
.columns { position:sticky; top:0; z-index:2; height:28px; background:var(--raised); font-size:11px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--muted); }
.columns > span { padding:0 10px; white-space:nowrap; overflow:hidden; }
.columns > span:empty { padding:0; }
.row { height:36px; cursor:pointer; }
.row:hover { background:var(--hover); }
.row.is-head { background:var(--head); }
.row.selected { background:var(--selected); }
.row.off-branch > * { opacity:.48; }
.row.off-branch:hover > *, .row.off-branch.selected > * { opacity:1; }
.cell { padding:0 10px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
.refs { display:flex; align-items:center; gap:4px; padding-right:0; }
.ghost-branch { font-size:12px; overflow:hidden; text-overflow:ellipsis; opacity:.72; }
.pill { display:inline-flex; align-items:center; gap:4px; min-width:0; height:22px; padding:0 7px; border-radius:4px; color:#fff; font-size:12px; font-weight:600; }
.pill .text { overflow:hidden; text-overflow:ellipsis; }
.pill svg { flex:none; }
.pill.is-current { box-shadow:0 0 0 2px var(--text); }
.pill.tag { background:transparent !important; color:var(--text); box-shadow:inset 0 0 0 1px var(--muted); }
.more-refs { flex:none; color:var(--muted); font-size:11px; }
.graph { display:block; }
.graph text { font:700 9px system-ui, sans-serif; fill:var(--on-avatar); text-anchor:middle; dominant-baseline:central; }
.subject .merge { color:var(--muted); }
.author { display:flex; align-items:center; gap:7px; }
.author .label { overflow:hidden; text-overflow:ellipsis; }
.avatar { flex:none; display:inline-grid; place-items:center; width:20px; height:20px; border-radius:50%; color:var(--on-avatar); font-size:9px; font-weight:700; }
.date, .sha { color:var(--muted); font-size:12px; font-variant-numeric:tabular-nums; }
#state { color:var(--muted); padding:18px; text-align:center; }
#more { display:block; margin:12px auto 18px; }

#details { flex:none; width:360px; overflow-y:auto; background:var(--panel); border-left:1px solid var(--line); padding:14px 16px 28px; }
.details-head { display:flex; gap:10px; align-items:flex-start; }
.details-head h2 { flex:1; font-size:15px; line-height:1.3; margin:0; overflow-wrap:anywhere; }
#close { font-size:18px; line-height:1; padding:2px 6px; color:var(--muted); border-radius:4px; }
#close:hover { background:var(--hover); }
.body { white-space:pre-wrap; overflow-wrap:anywhere; color:var(--muted); margin:8px 0 0; }
.person { display:flex; align-items:center; gap:9px; margin:14px 0; }
.person .avatar { width:32px; height:32px; font-size:12px; }
.person small { display:block; color:var(--muted); }
h3 { font-size:11px; letter-spacing:.05em; text-transform:uppercase; color:var(--muted); margin:16px 0 6px; }
.wrap { display:flex; flex-wrap:wrap; gap:4px; }
.badge { padding:1px 7px; border-radius:4px; background:var(--raised); font-size:12px; overflow-wrap:anywhere; }
.badge.is-current { background:var(--head); font-weight:650; }
.link { color:var(--accent); } .link:hover { text-decoration:underline; }
.actions { display:flex; gap:6px; flex-wrap:wrap; margin-top:12px; }
.file { display:flex; gap:8px; padding:3px 0; font-size:12px; }
.file .path { flex:1; min-width:0; overflow-wrap:anywhere; }
.add { color:var(--add); } .del { color:var(--del); }
.file .add, .file .del { flex:none; font-variant-numeric:tabular-nums; }

@media (max-width:1100px) {
  #details { position:absolute; inset:0 0 0 auto; z-index:4; width:min(360px, 100%); box-shadow:-6px 0 18px rgb(0 0 0 / .25); }
}
@media (max-width:760px) {
  #menu { display:block; }
  #sidebar { position:absolute; inset:0 auto 0 0; z-index:3; display:none; box-shadow:6px 0 18px rgb(0 0 0 / .25); }
  #sidebar.open { display:block; }
  #filters { order:5; flex-basis:100%; }
}
</style>
</head>
<body>
<header class="topbar">
  <button id="menu" class="toolbar-button" type="button" aria-label="Afficher les branches">☰</button>
  <span id="repo" class="repo">gitpilot</span>
  <button id="current" class="current" type="button" title="Aller au commit HEAD" hidden></button>
  <span id="filter-chip" class="chip" hidden><span id="filter-text"></span><button id="filter-clear" type="button" aria-label="Retirer le filtre">×</button></span>
  <form id="filters" role="search">
    <input id="search" type="search" placeholder="Rechercher un commit…" aria-label="Recherche">
    <select id="field" aria-label="Champ recherché">
      <option value="message">Message</option><option value="author">Auteur</option><option value="hash">Hash</option>
    </select>
  </form>
  <a class="toolbar-button" href="/help">Aide</a>
  <button id="theme" class="toolbar-button" type="button">Thème</button>
</header>
<div class="layout">
  <nav id="sidebar" aria-label="Branches et auteurs"></nav>
  <main class="center" id="center">
    <div class="columns"><span>Branche / tag</span><span id="graph-title">Graphe</span><span>Message</span><span>Auteur</span><span>Date</span><span>SHA</span></div>
    <div id="rows"></div>
    <div id="state" hidden></div>
    <button id="more" class="toolbar-button" type="button" hidden>Charger 100 commits de plus</button>
  </main>
  <aside id="details" aria-label="Détail du commit" hidden></aside>
</div>
<script>
const ROW_HEIGHT = 36, LANE_WIDTH = 24, LANE_OFFSET = 16, AVATAR_RADIUS = 11, MERGE_RADIUS = 5, MIN_GRAPH_WIDTH = 0;
const SVG_NS = "http://www.w3.org/2000/svg";
const LANE_COLORS = ["#1f9ce0", "#16a371", "#e0702b", "#a855d8", "#d19a0b", "#e0497f", "#4f6fe8", "#0fa5a5"];
const AUTHOR_COLORS = ["#b5472d", "#2c7a51", "#3b5fc4", "#8b3fb0", "#a86a00", "#b03060", "#00788a", "#5b6472"];
const byId = (id) => document.getElementById(id);
const rowsNode = byId("rows"), stateNode = byId("state"), moreButton = byId("more"), detailsNode = byId("details");
const sidebarNode = byId("sidebar"), searchInput = byId("search"), fieldSelect = byId("field");

let repo = null, loaded = [], nextPage = 0, hasMore = false, loadToken = 0, detailToken = 0;
let selectedBranch = "", selectedHash = null;

function element(tag, text, className) {
  const node = document.createElement(tag);
  if (text !== undefined) node.textContent = text;
  if (className) node.className = className;
  return node;
}
function svgNode(tag, attributes) {
  const node = document.createElementNS(SVG_NS, tag);
  Object.entries(attributes).forEach(([name, value]) => node.setAttribute(name, value));
  return node;
}
function hashText(text) {
  return [...text].reduce((hash, character) => (hash * 31 + character.codePointAt(0)) >>> 0, 7);
}
const authorColor = (name) => AUTHOR_COLORS[hashText(name) % AUTHOR_COLORS.length];
const laneColor = (lane) => LANE_COLORS[lane % LANE_COLORS.length];
const branchColor = (name) => LANE_COLORS[hashText(name) % LANE_COLORS.length];

function initials(name) {
  const words = name.trim().split(/\s+/).filter(Boolean);
  const letters = words.length > 1 ? [words[0], words[words.length - 1]] : words;
  return letters.map((word) => [...word][0]).join("").toUpperCase() || "?";
}
function avatar(name) {
  const node = element("span", initials(name), "avatar");
  node.style.background = authorColor(name);
  return node;
}

/* ---- Thème ---- */
function applyTheme(theme) {
  document.documentElement.dataset.theme = theme;
  try { localStorage.setItem("gitpilot-theme", theme); } catch {}
}
function savedTheme() {
  try { return localStorage.getItem("gitpilot-theme"); } catch { return null; }
}
applyTheme(savedTheme() ?? (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark"));
byId("theme").onclick = () => applyTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");

/* ---- Graphe ---- */
const laneX = (lane) => LANE_OFFSET + lane * LANE_WIDTH;

/* Attribue à chaque commit une colonne et les segments à tracer sur sa ligne. */
function computeGraph(commits) {
  const lanes = [];
  const freeLane = () => { const index = lanes.indexOf(null); return index === -1 ? lanes.length : index; };
  return commits.map((commit) => {
    let column = lanes.indexOf(commit.hash);
    const isBranchTip = column === -1;
    if (isBranchTip) { column = freeLane(); lanes[column] = commit.hash; }
    const segments = [];
    lanes.forEach((hash, lane) => {
      if (hash === null || lane === column) return;
      if (hash === commit.hash) { segments.push({ from: lane, to: column, part: "in" }); lanes[lane] = null; }
      else segments.push({ from: lane, to: lane, part: "through" });
    });
    if (!isBranchTip) segments.push({ from: column, to: column, part: "in" });
    const [firstParent, ...otherParents] = commit.parents;
    lanes[column] = firstParent ?? null;
    if (firstParent) segments.push({ from: column, to: column, part: "out" });
    otherParents.forEach((parent) => {
      let lane = lanes.indexOf(parent);
      if (lane === -1) { lane = freeLane(); lanes[lane] = parent; }
      segments.push({ from: column, to: lane, part: "out" });
    });
    const width = Math.max(lanes.length, column + 1, ...segments.map((s) => Math.max(s.from, s.to) + 1));
    while (lanes.length > 0 && lanes[lanes.length - 1] === null) lanes.pop();
    return { column, segments, width };
  });
}

function segmentPath(segment) {
  const middle = ROW_HEIGHT / 2;
  const fromX = laneX(segment.from), toX = laneX(segment.to);
  if (segment.part === "through") return `M${fromX} 0 L${toX} ${ROW_HEIGHT}`;
  if (segment.part === "in") return `M${fromX} 0 C${fromX} ${middle},${toX} ${middle / 2},${toX} ${middle}`;
  return `M${fromX} ${middle} C${fromX} ${middle * 1.5},${toX} ${middle},${toX} ${ROW_HEIGHT}`;
}

function graphPixelWidth(lanes) {
  return LANE_OFFSET * 2 + (lanes - 1) * LANE_WIDTH;
}

function drawGraph(commit, cell, lanes) {
  const middle = ROW_HEIGHT / 2, x = laneX(cell.column), color = laneColor(cell.column);
  const svg = svgNode("svg", { class: "graph", width: graphPixelWidth(lanes), height: ROW_HEIGHT, "aria-hidden": "true" });
  if (groupRefs(commit.refs).length > 0) {
    svg.append(svgNode("path", { d: `M0 ${middle} L${x} ${middle}`, stroke: color, "stroke-width": 2, opacity: 0.7 }));
  }
  cell.segments.forEach((segment) => {
    const lane = segment.part === "out" ? segment.to : segment.from;
    svg.append(svgNode("path", { d: segmentPath(segment), fill: "none", stroke: laneColor(lane), "stroke-width": 2 }));
  });
  if (commit.parents.length > 1) {
    svg.append(svgNode("circle", { cx: x, cy: middle, r: MERGE_RADIUS, fill: color }));
    return svg;
  }
  svg.append(svgNode("circle", { cx: x, cy: middle, r: AVATAR_RADIUS, fill: authorColor(commit.author), stroke: color, "stroke-width": 2 }));
  const label = svgNode("text", { x, y: middle });
  label.textContent = initials(commit.author);
  svg.append(label);
  return svg;
}

/* ---- Lignes ---- */
function iconLaptop() {
  const svg = svgNode("svg", { width: 12, height: 12, viewBox: "0 0 16 16", "aria-label": "local" });
  svg.append(svgNode("path", { d: "M3 3h10v7H3zM1 12h14v1.5H1z", fill: "currentColor" }));
  return svg;
}
function iconCloud() {
  const svg = svgNode("svg", { width: 13, height: 12, viewBox: "0 0 18 14", "aria-label": "distant" });
  svg.append(svgNode("path", { d: "M5 13a4 4 0 0 1-.6-8A5 5 0 0 1 14 5.2 3.9 3.9 0 0 1 14 13z", fill: "currentColor" }));
  return svg;
}

/* Fusionne « main » et « origin/main » en une seule étiquette, comme une seule branche. */
function groupRefs(refs) {
  const groups = new Map();
  refs.forEach((ref) => {
    if (ref.kind === "head" || ref.kind === "stash") return;
    const label = ref.kind === "remote" ? ref.name.slice(ref.name.indexOf("/") + 1) : ref.name;
    const groupKey = (ref.kind === "tag" ? "tag:" : "branch:") + label;
    const group = groups.get(groupKey) ?? { label, isTag: ref.kind === "tag", local: false, remote: false };
    if (ref.kind === "branch") group.local = true;
    if (ref.kind === "remote") group.remote = true;
    groups.set(groupKey, group);
  });
  const isCurrent = (group) => group.local && group.label === repo?.head.branch;
  return [...groups.values()].sort((a, b) => Number(isCurrent(b)) - Number(isCurrent(a)) || Number(a.isTag) - Number(b.isTag));
}

function refPill(group, color) {
  const isCurrent = group.local && group.label === repo?.head.branch;
  const pill = element("span", undefined, "pill" + (group.isTag ? " tag" : "") + (isCurrent ? " is-current" : ""));
  pill.style.background = color;
  if (isCurrent) pill.append(element("span", "✓"));
  pill.append(element("span", group.label, "text"));
  if (group.local) pill.append(iconLaptop());
  if (group.remote) pill.append(iconCloud());
  return pill;
}

function refsCell(commit, color) {
  const cell = element("div", undefined, "cell refs");
  const groups = groupRefs(commit.refs);
  cell.title = groups.map((group) => group.label).join(", ") || commit.branch;
  if (groups.length === 0) {
    if (commit.branch !== "") {
      const ghost = element("span", commit.branch, "ghost-branch");
      ghost.style.color = color;
      cell.append(ghost);
    }
    return cell;
  }
  cell.append(refPill(groups[0], color));
  if (groups.length > 1) cell.append(element("span", "+" + (groups.length - 1), "more-refs"));
  return cell;
}

function formatDate(iso) {
  return new Date(iso).toLocaleString("fr-FR", { day: "2-digit", month: "2-digit", year: "2-digit", hour: "2-digit", minute: "2-digit" });
}

function commitRow(commit, cell, lanes, dimOtherBranches) {
  const color = cell ? laneColor(cell.column) : branchColor(commit.branch);
  const row = element("div", undefined, "row");
  row.tabIndex = 0;
  row.setAttribute("role", "button");
  row.dataset.hash = commit.hash;
  row.classList.toggle("is-head", commit.hash === repo?.head.hash);
  row.classList.toggle("selected", commit.hash === selectedHash);
  row.classList.toggle("off-branch", dimOtherBranches && !commit.onCurrentBranch);
  row.onclick = () => selectCommit(commit);
  row.onkeydown = (event) => { if (event.key === "Enter") selectCommit(commit); };

  const graph = element("div");
  if (cell) graph.append(drawGraph(commit, cell, lanes));

  const subject = element("div", undefined, "cell subject");
  subject.title = commit.subject;
  subject.append(element("span", commit.subject, commit.parents.length > 1 ? "merge" : undefined));

  const author = element("div", undefined, "cell author");
  author.title = commit.author;
  author.append(avatar(commit.author), element("span", commit.author, "label"));

  row.append(refsCell(commit, color), graph, subject, author, element("div", formatDate(commit.date), "cell date"), element("div", commit.shortHash.slice(0, 7), "cell sha mono"));
  return row;
}

/* Un graphe n'a de sens que sur un historique continu : pas sur des résultats de recherche. */
function render() {
  const isSearching = searchInput.value.trim() !== "";
  const cells = isSearching ? [] : computeGraph(loaded);
  const lanes = Math.max(1, ...cells.map((cell) => cell.width));
  document.documentElement.style.setProperty("--graph-width", (isSearching ? MIN_GRAPH_WIDTH : graphPixelWidth(lanes)) + "px");
  byId("graph-title").textContent = isSearching ? "" : "Graphe";
  const dim = !isSearching && selectedBranch === "" && loaded.some((commit) => commit.onCurrentBranch);
  rowsNode.replaceChildren(...loaded.map((commit, index) => commitRow(commit, cells[index], lanes, dim)));
}

function showState(text) {
  stateNode.hidden = text === "";
  stateNode.textContent = text;
}

/* ---- Barre latérale ---- */
function section(title, count, isOpen) {
  const node = element("details");
  node.open = isOpen;
  const summary = element("summary");
  summary.append(element("span", title), element("span", String(count)));
  node.append(summary);
  return node;
}

function aheadBehind(branch) {
  const parts = [];
  if (branch.ahead > 0) parts.push("↑" + branch.ahead);
  if (branch.behind > 0) parts.push("↓" + branch.behind);
  return parts.join(" ");
}

function branchItem(name, displayName, count) {
  const button = element("button", undefined, "item");
  button.type = "button";
  button.dataset.branch = name;
  button.title = name;
  const isCurrent = name === repo.head.branch;
  button.classList.toggle("current-branch", isCurrent);
  button.append(element("span", isCurrent ? "✓" : "", "tick"), element("span", displayName, "label"));
  if (count) button.append(element("span", count, "count"));
  button.onclick = () => filterByBranch(selectedBranch === name ? "" : name);
  return button;
}

function authorItem(author) {
  const button = element("button", undefined, "item");
  button.type = "button";
  button.dataset.author = author.name;
  button.title = author.name;
  button.append(avatar(author.name), element("span", author.name, "label"), element("span", String(author.commits), "count"));
  button.onclick = () => filterByAuthor(activeAuthor() === author.name ? "" : author.name);
  return button;
}

function renderSidebar() {
  const local = section("Local", repo.local.length, true);
  repo.local.forEach((branch) => local.append(branchItem(branch.name, branch.name, aheadBehind(branch))));

  const remote = section("Distant", repo.remote.length, true);
  const remotes = Map.groupBy(repo.remote, (name) => name.split("/")[0]);
  remotes.forEach((names, remoteName) => {
    remote.append(element("div", remoteName, "group-label"));
    names.forEach((name) => remote.append(branchItem(name, name.slice(remoteName.length + 1))));
  });

  const authors = section("Auteurs", repo.authors.length, true);
  repo.authors.forEach((author) => authors.append(authorItem(author)));

  const tags = section("Tags", repo.tags.length, false);
  repo.tags.forEach((tag) => {
    const item = element("div", undefined, "item static");
    item.append(element("span", tag, "label"));
    tags.append(item);
  });

  sidebarNode.replaceChildren(local, remote, authors, tags);
  markActiveFilters();
}

function activeAuthor() {
  return fieldSelect.value === "author" ? searchInput.value.trim() : "";
}

function markActiveFilters() {
  const author = activeAuthor();
  sidebarNode.querySelectorAll("[data-branch]").forEach((node) => node.classList.toggle("active", node.dataset.branch === selectedBranch));
  sidebarNode.querySelectorAll("[data-author]").forEach((node) => node.classList.toggle("active", node.dataset.author === author));
  byId("filter-chip").hidden = selectedBranch === "";
  byId("filter-text").textContent = selectedBranch;
}

function filterByBranch(branch) {
  selectedBranch = branch;
  sidebarNode.classList.remove("open");
  loadPage(0);
}

function filterByAuthor(author) {
  fieldSelect.value = "author";
  searchInput.value = author;
  sidebarNode.classList.remove("open");
  loadPage(0);
}

function renderCurrentBranch() {
  const node = byId("current");
  const local = repo.local.find((branch) => branch.name === repo.head.branch);
  const counts = local ? aheadBehind(local) : "";
  const label = repo.head.branch ?? (repo.head.hash ? "HEAD détaché · " + repo.head.hash.slice(0, 7) : "aucun commit");
  node.replaceChildren(element("small", "Vous êtes sur"), element("span", label, "name"));
  if (counts) node.append(element("small", counts));
  node.hidden = false;
}

async function goToHead() {
  const hash = repo?.head.hash;
  if (!hash) return;
  const commit = loaded.find((item) => item.hash === hash);
  if (commit) {
    selectCommit(commit);
    rowsNode.querySelector(`[data-hash="${hash}"]`)?.scrollIntoView({ block: "center" });
    return;
  }
  if (hasMore && await loadPage(nextPage)) goToHead();
}

/* ---- Détail ---- */
function copyButton(label, text) {
  const button = element("button", label, "toolbar-button");
  button.type = "button";
  button.onclick = async () => {
    try {
      await navigator.clipboard.writeText(text);
      button.textContent = "Copié";
    } catch {
      button.textContent = "Échec";
    }
    setTimeout(() => { button.textContent = label; }, 1200);
  };
  return button;
}

function closeDetails() {
  selectedHash = null;
  detailToken++;
  detailsNode.hidden = true;
  rowsNode.querySelectorAll(".selected").forEach((node) => node.classList.remove("selected"));
}

function selectCommit(commit) {
  selectedHash = commit.hash;
  rowsNode.querySelectorAll(".row").forEach((node) => node.classList.toggle("selected", node.dataset.hash === commit.hash));
  renderDetails(commit);
}

function parentLink(hash) {
  const parent = loaded.find((item) => item.hash === hash);
  if (!parent) return element("span", hash.slice(0, 7), "mono");
  const link = element("button", hash.slice(0, 7), "link mono");
  link.type = "button";
  link.onclick = () => {
    selectCommit(parent);
    rowsNode.querySelector(`[data-hash="${hash}"]`)?.scrollIntoView({ block: "center" });
  };
  return link;
}

function fileRow(file) {
  const row = element("div", undefined, "file");
  row.append(element("span", file.path, "path mono"));
  if (file.added === null) row.append(element("span", "binaire", "date"));
  else row.append(element("span", "+" + file.added, "add mono"), element("span", "−" + file.deleted, "del mono"));
  return row;
}

async function renderDetails(commit) {
  const token = ++detailToken;
  detailsNode.hidden = false;

  const head = element("div", undefined, "details-head");
  const close = element("button", "×");
  close.id = "close";
  close.type = "button";
  close.setAttribute("aria-label", "Fermer le détail");
  close.onclick = closeDetails;
  head.append(element("h2", commit.subject), close);

  const person = element("div", undefined, "person");
  const who = element("div");
  who.append(element("strong", commit.author), element("small", formatDate(commit.date)));
  person.append(avatar(commit.author), who);

  const actions = element("div", undefined, "actions");
  actions.append(copyButton("Copier le hash", commit.hash), copyButton("Copier /cherry-pick", "/cherry-pick " + commit.hash));

  const parents = element("div", undefined, "wrap");
  commit.parents.forEach((hash) => parents.append(parentLink(hash)));

  const body = element("div");
  detailsNode.replaceChildren(head, body, person, element("h3", "Branche"), element("div", commit.branch || "inconnue"), element("h3", "SHA"), element("div", commit.hash, "mono date"));
  if (commit.parents.length > 0) detailsNode.append(element("h3", commit.parents.length > 1 ? "Parents (fusion)" : "Parent"), parents);
  detailsNode.append(actions);
  const loadingNote = element("p", "Chargement…", "date");
  detailsNode.append(loadingNote);

  try {
    const response = await fetch("/api/commit?" + new URLSearchParams({ hash: commit.hash }));
    const data = await response.json();
    if (token !== detailToken) return;
    if (!response.ok) throw new Error(data.error);
    loadingNote.remove();
    if (data.body !== "") body.append(element("p", data.body, "body"));
    if (data.committer !== commit.author) who.append(element("small", "Commité par " + data.committer));
    detailsNode.append(containedInSection(data.containedIn), ...filesSection(data));
  } catch (error) {
    if (token === detailToken) loadingNote.textContent = "Erreur : " + error.message;
  }
}

function containedInSection(refs) {
  const container = element("div");
  const list = element("div", undefined, "wrap");
  refs.forEach((ref) => {
    const isCurrent = ref.kind === "branch" && ref.name === repo?.head.branch;
    list.append(element("span", ref.name, "badge" + (isCurrent ? " is-current" : "")));
  });
  container.append(element("h3", "Présent dans " + refs.length + " branche" + (refs.length > 1 ? "s" : "")), list);
  return container;
}

function filesSection(data) {
  const added = data.files.reduce((sum, file) => sum + (file.added ?? 0), 0);
  const deleted = data.files.reduce((sum, file) => sum + (file.deleted ?? 0), 0);
  const title = element("h3");
  title.append(data.fileCount + " fichier" + (data.fileCount > 1 ? "s" : "") + " · ", element("span", "+" + added, "add"), " ", element("span", "−" + deleted, "del"));
  const nodes = [title, ...data.files.map(fileRow)];
  if (data.fileCount > data.files.length) nodes.push(element("p", "… et " + (data.fileCount - data.files.length) + " autres fichiers.", "date"));
  return nodes;
}

/* ---- Chargement ---- */
async function loadPage(page) {
  const token = ++loadToken;
  const params = new URLSearchParams({ page, search: searchInput.value, field: fieldSelect.value, branch: selectedBranch });
  moreButton.disabled = true;
  markActiveFilters();
  try {
    const response = await fetch("/api/log?" + params);
    const data = await response.json();
    if (token !== loadToken) return false;
    if (!response.ok) throw new Error(data.error);
    loaded = page === 0 ? data.commits : loaded.concat(data.commits);
    nextPage = page + 1;
    hasMore = data.hasMore;
    render();
    showState(loaded.length === 0 ? "Aucun commit trouvé." : "");
    moreButton.hidden = !hasMore;
    return true;
  } catch (error) {
    if (token === loadToken) showState("Erreur : " + error.message);
    return false;
  } finally {
    moreButton.disabled = false;
  }
}

async function loadRepo() {
  const response = await fetch("/api/repo");
  const data = await response.json();
  if (!response.ok) throw new Error(data.error);
  repo = data;
  byId("repo").textContent = repo.name;
  document.title = repo.name + " · gitpilot";
  renderCurrentBranch();
  renderSidebar();
}

byId("filters").onsubmit = (event) => { event.preventDefault(); loadPage(0); };
fieldSelect.onchange = () => { if (searchInput.value.trim() !== "") loadPage(0); };
searchInput.onsearch = () => loadPage(0);
byId("filter-clear").onclick = () => filterByBranch("");
byId("current").onclick = goToHead;
byId("menu").onclick = () => sidebarNode.classList.toggle("open");
moreButton.onclick = () => loadPage(nextPage);
document.addEventListener("keydown", (event) => { if (event.key === "Escape") closeDetails(); });

loadRepo().then(() => loadPage(0)).catch((error) => showState("Erreur : " + error.message));
</script>
</body>
</html>
